name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Set up signing key
        if: env.SIGNING_KEYSTORE_B64 != ''
        run: |
          echo "$SIGNING_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing.keystore"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/signing.keystore" >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AntiReelShorts.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AntiReelShorts
          path: AntiReelShorts.apk

      # Publish to a fixed "latest" release so the APK can be downloaded
      # straight from a phone browser.
      - name: Publish release
        if: github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-${{ github.ref_name }}
          name: 最新ビルド (${{ github.ref_name }})
          prerelease: ${{ github.ref_name != 'main' }}
          files: AntiReelShorts.apk
